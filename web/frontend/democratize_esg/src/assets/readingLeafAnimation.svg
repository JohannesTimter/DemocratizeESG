<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
            <style>
                /* Face Animations */
                @keyframes read {
                    0%, 15% { transform: translateX(-4px); }
                    25%, 45% { transform: translateX(0px); }
                    55%, 75% { transform: translateX(4px); }
                    85%, 100% { transform: translateX(-4px); }
                }

                @keyframes blink {
                    0%, 93%, 100% { transform: scaleY(1); }
                    96% { transform: scaleY(0.2); }
                }

                @keyframes pulse {
                    0%, 100% { opacity: 0.7; transform: scale(1); }
                    50% { opacity: 1; transform: scale(1.1); }
                }

                .eyes-group {
                    animation: read 2.5s ease-in-out infinite;
                }

                .eye {
                    transform-origin: center;
                    transform-box: fill-box;
                    animation: blink 4s infinite;
                }

                .cheek {
                    transform-origin: center;
                    transform-box: fill-box;
                    animation: pulse 2.5s ease-in-out infinite;
                }
            </style>
            <defs>
                <!-- Leaf Body Gradient (Changed to Radial for more 3D shading) -->
                <radialGradient id="leafGrad" cx="35%" cy="35%" r="70%">
                    <stop offset="0%" stop-color="#d4f59d" />
                    <stop offset="40%" stop-color="#bae87f" />
                    <stop offset="100%" stop-color="#70af4b" />
                </radialGradient>

                <clipPath id="globeClip">
                    <circle cx="400" cy="400" r="340" />
                </clipPath>
            </defs>

            <!-- Background Badge -->
            <circle cx="400" cy="400" r="340" fill="#e9f5ec" />
            
            <!-- Globe Grid Lines -->
            <g clip-path="url(#globeClip)" fill="none" stroke="#cfe6d4" stroke-width="12" stroke-linecap="round">
                <!-- Vertical spherical arcs -->
                <path d="M 400,60 A 170,340 0 0,0 400,740" />
                <path d="M 400,60 A 170,340 0 0,1 400,740" />
                <!-- Horizontal spherical arcs -->
                <path d="M 60,400 A 340,170 0 0,1 740,400" />
                <path d="M 60,400 A 340,170 0 0,0 740,400" />
                <!-- Center lines -->
                <path d="M 400,60 L 400,740" />
                <path d="M 60,400 L 740,400" />
            </g>

            <!-- ================= THE HAPPY LEAF (Now larger and behind the book) ================= -->
            <g id="leaf" transform="translate(112, 85) scale(0.72)">
                <!-- Leaf Stem (Thicker, extending lower to connect behind the book spine) -->
                <path d="M 400,470 Q 400,600 385,850" 
                      fill="none" stroke="#4a7a2c" stroke-width="22" stroke-linecap="round"/>

                <!-- Leaf Body (Turned upright: round base, pointy top) -->
                <path d="M 400,480 C 300,480 260,400 260,350 C 260,200 360,150 400,120 C 440,150 540,200 540,350 C 540,400 500,480 400,480 Z" 
                      fill="url(#leafGrad)" stroke="#4a7a2c" stroke-width="14" stroke-linejoin="round"/>
                
                <!-- Leaf Highlights and Shading details -->
                <path d="M 400,150 C 330,180 285,250 285,340" fill="none" stroke="#e0f8b8" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
                <path d="M 400,455 C 470,455 515,390 515,330" fill="none" stroke="#5a8c3c" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

                <!-- Leaf Veins -->
                <path d="M 400,460 L 400,140 M 400,400 Q 360,390 320,350 M 400,320 Q 350,300 300,260 M 400,240 Q 360,220 330,180 M 400,400 Q 440,390 480,350 M 400,320 Q 450,300 500,260 M 400,240 Q 440,220 470,180" 
                      fill="none" stroke="#5da138" stroke-width="8" stroke-linecap="round"/>
                
                <!-- Leaf Face (Moved down slightly to sit in the wider bottom half) -->
                <!-- Cheeks -->
                <ellipse cx="310" cy="355" rx="18" ry="12" fill="#c6eda1" class="cheek"/>
                <ellipse cx="490" cy="355" rx="18" ry="12" fill="#c6eda1" class="cheek"/>
                
                <!-- Moving Eyes -->
                <g class="eyes-group">
                    <g class="eye">
                        <circle cx="350" cy="320" r="16" fill="#3b2b20" />
                        <circle cx="345" cy="315" r="4" fill="#ffffff" />
                    </g>
                    <g class="eye">
                        <circle cx="450" cy="320" r="16" fill="#3b2b20" />
                        <circle cx="445" cy="315" r="4" fill="#ffffff" />
                    </g>
                </g>
                
                <!-- Happy Mouth -->
                <path d="M 385,340 Q 400,365 415,340" fill="none" stroke="#3b2b20" stroke-width="12" stroke-linecap="round"/>
            </g>

            <!-- ================= BOOK GROUP (Scaled down slightly) ================= -->
            <g id="book" transform="translate(48, 80) scale(0.88)">

            <!-- ================= BOOK BACK COVERS ================= -->
            <!-- Left Cover (Orange/Brown) -->
            <path d="M 370,520 L 150,420 A 15,15 0 0 0 130,435 L 130,590 A 15,15 0 0 0 150,605 L 370,670 Z" 
                  fill="#de986a" stroke="#3b2b20" stroke-width="14" stroke-linejoin="round"/>
            
            <!-- Right Cover (Green) -->
            <path d="M 430,520 L 650,420 A 15,15 0 0 1 670,435 L 670,590 A 15,15 0 0 1 650,605 L 430,670 Z" 
                  fill="#8cc967" stroke="#3b2b20" stroke-width="14" stroke-linejoin="round"/>

            <!-- Gear Icon on Right Cover -->
            <g transform="translate(560, 530) skewY(-20)">
                <!-- Gear Outer spokes -->
                <path d="M 0,-35 L 0,35 M -30,-17 L 30,17 M -30,17 L 30,-17" 
                      stroke="#3b2b20" stroke-width="16" stroke-linecap="round"/>
                <!-- Gear Body -->
                <circle cx="0" cy="0" r="22" fill="#8cc967" stroke="#3b2b20" stroke-width="12"/>
                <!-- Gear Hole -->
                <circle cx="0" cy="0" r="8" fill="#8cc967" stroke="#3b2b20" stroke-width="8"/>
            </g>

            <!-- ================= BOOK PAGES STACKS ================= -->
            <!-- Left Page Stack Side -->
            <path d="M 370,510 L 150,410 L 150,420 L 370,520 Z" 
                  fill="#f2e2c4" stroke="#3b2b20" stroke-width="14" stroke-linejoin="round"/>
            <!-- Right Page Stack Side -->
            <path d="M 430,510 L 650,410 L 650,420 L 430,520 Z" 
                  fill="#f2e2c4" stroke="#3b2b20" stroke-width="14" stroke-linejoin="round"/>
            
            <!-- Page Lines on sides -->
            <path d="M 370,505 L 150,405 M 430,505 L 650,405" stroke="#3b2b20" stroke-width="6"/>

            <!-- Center Bridge (covers the gap under the leaf) -->
            <path d="M 370,510 L 430,510 L 430,450 L 370,450 Z" fill="#fffaef" stroke="#3b2b20" stroke-width="12"/>

            <!-- Static Left Page Surface -->
            <path d="M 370,510 C 320,500 220,440 150,410 L 210,360 C 270,370 340,430 370,450 Z" 
                  fill="#fffaef" stroke="#3b2b20" stroke-width="12" stroke-linejoin="round"/>
            
            <!-- Static Right Page Surface -->
            <path d="M 430,510 C 480,500 580,440 650,410 L 590,360 C 530,370 460,430 430,450 Z" 
                  fill="#fffaef" stroke="#3b2b20" stroke-width="12" stroke-linejoin="round"/>


            <!-- ================= (LEAF WAS HERE) ================= -->


            <!-- Static Left Arm (Resting on left page) -->
            <g id="left-arm">
                <path d="M 330,420 Q 280,410 270,440" fill="none" stroke="#3b2b20" stroke-width="20" stroke-linecap="round"/>
                <path d="M 330,420 Q 280,410 270,440" fill="none" stroke="#7bbd56" stroke-width="10" stroke-linecap="round"/>
                <path d="M 260,430 C 250,440 260,460 270,460 C 280,460 290,440 280,430 Z" fill="#7bbd56" stroke="#3b2b20" stroke-width="8" stroke-linejoin="round"/>
            </g>


            <!-- ================= ANIMATED PAGE FLIP ================= -->
            <g>
                <!-- Opacity animation: Visible while turning, instantly invisible at the end to snap back seamlessly -->
                <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.32; 0.33; 1" dur="5s" repeatCount="indefinite"/>

                <!-- The Morphing Page Path -->
                <path fill="#fffaef" stroke="#3b2b20" stroke-width="12" stroke-linejoin="round">
                    <animate attributeName="d" 
                        keyTimes="0; 0.08; 0.16; 0.24; 0.32; 0.4; 1" 
                        dur="5s" 
                        repeatCount="indefinite"
                        values="
                            M 430,510 C 480,500 580,440 650,410 L 590,360 C 530,370 460,430 430,450 Z;
                            M 415,505 C 460,470 530,390 540,320 L 500,270 C 460,300 430,410 415,445 Z;
                            M 400,500 C 420,430 420,310 400,250 L 380,220 C 400,310 400,420 400,440 Z;
                            M 385,505 C 340,470 270,390 260,320 L 300,270 C 340,300 370,410 385,445 Z;
                            M 370,510 C 320,500 220,440 150,410 L 210,360 C 270,370 340,430 370,450 Z;
                            M 370,510 C 320,500 220,440 150,410 L 210,360 C 270,370 340,430 370,450 Z;
                            M 370,510 C 320,500 220,440 150,410 L 210,360 C 270,370 340,430 370,450 Z" />
                </path>

                <!-- Animated Arm (Morphing Path tracking the page corner) -->
                <!-- Background Stroke for outline -->
                <path fill="none" stroke="#3b2b20" stroke-width="20" stroke-linecap="round">
                    <animate attributeName="d" 
                        keyTimes="0; 0.08; 0.16; 0.24; 0.32; 0.4; 1" 
                        dur="5s" 
                        repeatCount="indefinite"
                        values="
                            M 470,350 Q 540,330 590,360; 
                            M 470,350 Q 510,290 500,270; 
                            M 470,350 Q 450,230 380,220; 
                            M 470,350 Q 380,240 300,270; 
                            M 470,350 Q 310,320 210,360; 
                            M 470,350 Q 540,330 590,360;
                            M 470,350 Q 540,330 590,360"/>
                </path>
                <!-- Foreground Arm Fill -->
                <path fill="none" stroke="#7bbd56" stroke-width="10" stroke-linecap="round">
                    <animate attributeName="d" 
                        keyTimes="0; 0.08; 0.16; 0.24; 0.32; 0.4; 1" 
                        dur="5s" 
                        repeatCount="indefinite"
                        values="
                            M 470,350 Q 540,330 590,360; 
                            M 470,350 Q 510,290 500,270; 
                            M 470,350 Q 450,230 380,220; 
                            M 470,350 Q 380,240 300,270; 
                            M 470,350 Q 310,320 210,360; 
                            M 470,350 Q 540,330 590,360;
                            M 470,350 Q 540,330 590,360"/>
                </path>

                <!-- Animated Hand (Translates and Rotates with the page corner) -->
                <g>
                    <!-- Translation matches Point C of the Page Morph -->
                    <animateTransform attributeName="transform" type="translate" 
                        keyTimes="0; 0.08; 0.16; 0.24; 0.32; 0.4; 1" 
                        dur="5s" 
                        repeatCount="indefinite"
                        values="590,360; 500,270; 380,220; 300,270; 210,360; 590,360; 590,360" />
                    
                    <g>
                        <!-- Rotation tilts the hand naturally as it turns the page -->
                        <animateTransform attributeName="transform" type="rotate" 
                            keyTimes="0; 0.08; 0.16; 0.24; 0.32; 0.4; 1" 
                            dur="5s" 
                            repeatCount="indefinite"
                            values="0; -30; -60; -90; -120; 0; 0" />
                        
                        <!-- The Hand Graphic -->
                        <path d="M -10,10 C -20,-5 -10,-20 0,-25 C 10,-20 20,-5 10,10 Z" 
                              fill="#7bbd56" stroke="#3b2b20" stroke-width="8" stroke-linejoin="round"/>
                    </g>
                </g>
            </g>


            <!-- ================= BOOK SPINE (Front-most element) ================= -->
            <path d="M 370,510 C 390,525 410,525 430,510 L 430,670 C 410,685 390,685 370,670 Z" 
                  fill="#8ecbe0" stroke="#3b2b20" stroke-width="14" stroke-linejoin="round"/>
            
            <!-- Spine Decorative Lines -->
            <path d="M 370,570 C 390,585 410,585 430,570" fill="none" stroke="#5299ab" stroke-width="10" stroke-linecap="round"/>
            <path d="M 370,620 C 390,635 410,635 430,620" fill="none" stroke="#5299ab" stroke-width="10" stroke-linecap="round"/>

            </g>

        </svg>